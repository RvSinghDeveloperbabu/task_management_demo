apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-app-web
  namespace: task-app-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-app-web
  template:
    metadata:
      labels:
        app: task-app-web
    spec:
      imagePullSecrets:
        - name: ecr-secret
      terminationGracePeriodSeconds: 45 
      containers:
      - name: task-app-web
        image: 929219061160.dkr.ecr.ap-southeast-2.amazonaws.com/task-app-frontend:latest
        envFrom:
          - configMapRef: {name: task-app-configmap}
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet: 
            path: /
            port: 8080
          initialDelaySeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: task-app-web
  namespace: task-app-namespace
spec:
  type: ClusterIP
  selector:
    app: task-app-web
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
