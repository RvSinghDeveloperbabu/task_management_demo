apiVersion: batch/v1
kind: Job
metadata:
  name: rails-migration-job
  namespace: task-app-namespace
spec:
  ttlSecondsAfterFinished: 100
  template:
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
      - name: rails-migration
        image: 929219061160.dkr.ecr.ap-southeast-2.amazonaws.com/task-app-backend:latest
        command: ["bundle", "exec", "rails", "db:migrate", "db:seed"]
        envFrom:
          - configMapRef: {name: task-app-configmap}
          - secretRef: {name: task-app-secret}
        volumeMounts:
        - name: rds-ca-cert
          mountPath: /app/config/certs
          readOnly: true
      volumes:
      - name: rds-ca-cert
        configMap:
          name: rds-ca-cert
      restartPolicy: Never