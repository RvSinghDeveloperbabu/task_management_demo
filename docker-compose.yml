# Run everything locally:  docker compose up --build
# App:     http://localhost:8080   (React + nginx, proxies /api to Rails)
# API:     http://localhost:3000   (direct access, handy for curl)

x-backend-env: &backend-env
  RAILS_ENV: production
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/tasks_production
  REDIS_URL: redis://redis:6379/0
  # Placeholder for local use only. In Kubernetes this comes from a Secret.
  SECRET_KEY_BASE: ${SECRET_KEY_BASE:-local-dev-only-placeholder-do-not-use-in-real-environments-0123456789abcdef}
  RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tasks_production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks_production"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs once, then exits. In Kubernetes this becomes a Job (or Helm pre-install hook).
  migrate:
    build: ./backend
    image: task-app-backend:local
    command: ["bundle", "exec", "rails", "db:prepare"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: task-app-backend:local
    command: ["bundle", "exec", "puma", "-C", "config/puma.rb"]
    environment: *backend-env
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  sidekiq:
    image: task-app-backend:local
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    environment: *backend-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: task-app-frontend:local
    environment:
      BACKEND_URL: http://backend:3000
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
